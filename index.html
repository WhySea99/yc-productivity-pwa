<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YC Focus Flow Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffcc">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            margin: 0;
            padding: 15px;
        }
        .app-container {
            max-width: 600px;
            margin: 0 auto;
            background: #1c1c1f;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        h1 { color: #00ffcc; margin: 0; font-size: 22px; }
        
        /* Wave Animation Canvas */
        #wave-canvas {
            width: 100%;
            height: 60px;
            background: #141416;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #29292e;
        }

        select, input, button {
            background: #29292e;
            color: #fff;
            border: 1px solid #323238;
            padding: 12px;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }
        select { width: 100%; margin-bottom: 15px; border-color: #00ffcc; font-weight: bold; }
        
        /* Controls Group */
        .control-panel {
            background: #202024;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #29292e;
        }
        .slider-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .slider-group input[type="range"] {
            flex: 1;
            margin-left: 15px;
            accent-color: #00ffcc;
        }
        .timer-display {
            font-size: 42px;
            font-weight: bold;
            text-align: center;
            color: #ffcc00;
            margin: 10px 0;
            font-family: monospace;
        }
        .btn-row {
            display: flex;
            gap: 10px;
        }
        .btn-row button { flex: 1; font-weight: bold; cursor: pointer; }
        .btn-start { background: #00ffcc; color: #121214; }
        .btn-pause { background: #ffcc00; color: #121214; }
        .btn-distract { background: #ff4a5a; color: #fff; }

        /* Stats Grid */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: #202024;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid #29292e;
        }
        .stat-card div:first-child { font-size: 11px; color: #8d8d99; margin-bottom: 4px; }
        .stat-card div:last-child { font-size: 18px; font-weight: bold; color: #e1e1e6; }

        /* Settings and Action Section */
        .section-title { font-size: 14px; color: #00ffcc; text-transform: uppercase; margin: 15px 0 8px 0; font-weight: bold;}
        .input-row { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-row input { flex: 1; }
        .btn-add { background: #00ffcc; color: #121214; font-weight: bold; cursor: pointer; }

        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: #202024;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #00ffcc;
        }
        li.done { border-left-color: #555; opacity: 0.5; }
        li.done span { text-decoration: line-through; }
        .btn-done { background: #00ffcc; color: #121214; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; cursor: pointer; font-weight: bold; }

        /* Settings Card */
        .settings-card {
            background: #202024;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ff4a5a;
            margin-top: 25px;
        }
        .settings-card h3 { color: #ff4a5a; margin: 0 0 10px 0; font-size: 16px; }
        .purge-btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .btn-purge { background: #2a1a1e; border: 1px solid #ff4a5a; color: #ff4a5a; font-size: 12px; cursor: pointer; padding: 8px; font-weight: bold;}
        .btn-purge:hover { background: #ff4a5a; color: #fff; }
        .btn-export { background: #1c2a22; border: 1px solid #2ecc71; color: #2ecc71; grid-column: span 2; padding: 10px; font-weight: bold;}

        canvas.hidden-canvas { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>🚀 YC Focus Flow</h1>
    </header>

    <!-- Wavelength Animation Canvas -->
    <canvas id="wave-canvas"></canvas>

    <!-- Mode Selector -->
    <select id="mode-select" onchange="changeMode()">
        <option value="Tasks">🎯 Mode: General Tasks</option>
        <option value="Meditation">🧘 Mode: Meditation</option>
        <option value="Exercise">💪 Mode: Exercise</option>
        <option value="Cooking">🍳 Mode: Cooking</option>
    </select>

    <!-- Interactive Active Timing Dashboard -->
    <div class="control-panel">
        <div class="slider-group" id="slider-wrapper">
            <span>Duration: <b id="slider-val">25</b>m</span>
            <input type="range" id="time-slider" min="1" max="120" value="25" oninput="adjustDuration(this.value)">
        </div>
        <div class="timer-display" id="timer-string">25:00</div>
        <div class="btn-row">
            <button id="start-btn" class="btn-start" onclick="toggleTimer()">Start Focus</button>
            <button class="btn-distract" onclick="logDistractionIncident()">⚠️ Log Distraction</button>
        </div>
    </div>

    <!-- Active Analytics Readout -->
    <div class="grid-stats">
        <div class="stat-card">
            <div>Focus Score</div>
            <div id="ui-score" style="color: #00ffcc;">100%</div>
        </div>
        <div class="stat-card">
            <div>Distractions Logged</div>
            <div id="ui-distractions" style="color: #ff4a5a;">0</div>
        </div>
        <div class="stat-card">
            <div>Extra / Overage Time</div>
            <div id="ui-extra">0m</div>
        </div>
        <div class="stat-card">
            <div>Sessions Done Today</div>
            <div id="ui-sessions">0</div>
        </div>
    </div>

    <!-- Actionable Goals Grid -->
    <div class="section-title">Actionable Session Goals</div>
    <div class="input-row">
        <input type="text" id="goal-input" placeholder="Add an active obligation...">
        <button class="btn-add" onclick="addGoalItem()">Add</button>
    </div>
    <ul id="goal-list"></ul>

    <!-- Advanced Purge Control Settings Page -->
    <div class="settings-card">
        <h3>🔧 Log Engine & Data Control</h3>
        <div class="purge-btn-grid">
            <button class="btn-purge" onclick="purgeLogs('day')">Delete Past Day</button>
            <button class="btn-purge" onclick="purgeLogs('week')">Delete Past Week</button>
            <button class="btn-purge" onclick="purgeLogs('month')">Delete Past Month</button>
            <button class="btn-purge" onclick="purgeLogs('all')">Clear All Logs</button>
            <button class="btn-purge btn-export" onclick="exportDataTxt()">📥 Download Text Summary Log</button>
            <button class="btn-purge btn-export" style="background:#1a2630; border-color:#00ffcc; color:#00ffcc;" onclick="generateStatSheetImage()">🖼️ Save Stat Sheet Image</button>
        </div>
    </div>
</div>

<canvas id="stat-canvas" class="hidden-canvas" width="500" height="400"></canvas>

<script>
    // Configuration Variables
    let currentMode = "Tasks";
    let timerInterval = null;
    let timerState = "stopped"; // stopped, running, paused, complete
    let timeRemaining = 1500; // in seconds
    let initialDurationSelected = 25; // in minutes
    let extraSecondsAccumulated = 0;
    
    // Core Engine State Structure (Auto loads from LocalStorage)
    let appLogs = JSON.parse(localStorage.getItem('yc_focus_logs')) || [];
    let activeGoals = JSON.parse(localStorage.getItem('yc_active_goals')) || [];
    let statsToday = JSON.parse(localStorage.getItem('yc_stats_today')) || { distractions: 0, completedSessions: 0, overageMinutes: 0 };

    // Request System Push Notification Permissions
    if (Notification.permission !== "granted" && Notification.permission !== "denied") {
        Notification.requestPermission();
    }

    function triggerSystemNotification(title, bodyText) {
        if (Notification.permission === "granted") {
            new Notification(title, { body: bodyText });
        }
    }

    // Interactive Sine Wavelength Canvas Animation
    const canvas = document.getElementById('wave-canvas');
    const ctx = canvas.getContext('2d');
    let animationPhase = 0;

    function renderWavelengthAnimation() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.beginPath();
        ctx.lineWidth = 2;

        // Visual feedback based on state behavior
        if (timerState === "running") {
            ctx.strokeStyle = '#00ffcc'; // Energized teal wave
            animationPhase += 0.08;
        } else if (timerState === "paused") {
            ctx.strokeStyle = '#ffcc00'; // Steady amber line
animationPhase += 0.01;
} else if (timerState === "complete") {
ctx.strokeStyle = '#ff4a5a'; // Fast alert overage wave
animationPhase += 0.15;
} else {
ctx.strokeStyle = '#323238'; // Resting idle waveform
animationPhase += 0.003;
}
let amplitude = timerState === "complete" ? 15 : (timerState === "running" ? 10 : 3);
let frequency = timerState === "complete" ? 0.05 : 0.02;
for (let x = 0; x < canvas.width; x++) {
let y = canvas.height / 2 + Math.sin(x * frequency + animationPhase) * amplitude;
if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
}
ctx.stroke();
requestAnimationFrame(renderWavelengthAnimation);
}
// Resizes canvas display resolution dynamically
function resizeCanvas() {
canvas.width = canvas.clientWidth;
canvas.height = canvas.clientHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();
renderWavelengthAnimation();
// Soft Ambient Synthesized Sine Audio Engine
function triggerAudioChime() {
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
const oscillator = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();
oscillator.type = 'sine';
oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // Node A4 Tone
gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);
oscillator.connect(gainNode);
gainNode.connect(audioCtx.destination);
oscillator.start();
oscillator.stop(audioCtx.currentTime + 0.7);
}
// System Dashboard Clock & Flow Routines
function adjustDuration(mins) {
if (timerState === "stopped") {
initialDurationSelected = parseInt(mins);
document.getElementById('slider-val').innerText = mins;
timeRemaining = initialDurationSelected * 60;
refreshUIClock();
}
}
function refreshUIClock() {
let displaySecs = timeRemaining % 60;
let displayMins = Math.floor(timeRemaining / 60);
document.getElementById('timer-string').innerText =
${displayMins.toString().padStart(2, '0')}:${displaySecs.toString().padStart(2, '0')};
}
function toggleTimer() {
const startBtn = document.getElementById('start-btn');
const sliderWrapper = document.getElementById('slider-wrapper');
if (timerState === "stopped" || timerState === "paused") {
// Run and initialize
if (timerState === "stopped") {
triggerSystemNotification("Focus mode initialized.", "Happy productive working!");
}
timerState = "running";
startBtn.innerText = "Pause Session";
startBtn.className = "btn-pause";
sliderWrapper.style.opacity = "0.3";
sliderWrapper.style.pointerEvents = "none";
timerInterval = setInterval(() => {
if (timeRemaining > 0) {
timeRemaining--;
refreshUIClock();
if (timeRemaining === 0) {
handleSessionCoreTargetMet();
}
} else {
// Running into extra/overage duration calculations
extraSecondsAccumulated++;
statsToday.overageMinutes = Math.floor(extraSecondsAccumulated / 60);
document.getElementById('ui-extra').innerText = ${statsToday.overageMinutes}m;
let extraMinsDisplay = Math.floor(extraSecondsAccumulated / 60);
let extraSecsDisplay = extraSecondsAccumulated % 60;
document.getElementById('timer-string').innerText = +${extraMinsDisplay}:${extraSecsDisplay.toString().padStart(2, '0')};
}
}, 1000);
} else if (timerState === "running" || timerState === "complete") {
// Stop/Pause operations
clearInterval(timerInterval);
if (timerState === "complete") {
// Finalize an overage session loop entirely
saveCurrentSessionToLog();
resetTimerSystemToIdle();
} else {
timerState = "paused";
startBtn.innerText = "Resume Focus";
startBtn.className = "btn-start";
}
}
}
function handleSessionCoreTargetMet() {
timerState = "complete";
triggerAudioChime();
triggerSystemNotification("🎯 Target Met!", "Core focus allocation accomplished! Tracking extra overage time now.");
statsToday.completedSessions++;
document.getElementById('start-btn').innerText = "Complete & Stop Session";
document.getElementById('start-btn').className = "btn-start";
saveStateToLocalStorage();
updateScoreAndStatsDisplay();
}
function resetTimerSystemToIdle() {
timerState = "stopped";
clearInterval(timerInterval);
extraSecondsAccumulated = 0;
timeRemaining = initialDurationSelected * 60;
document.getElementById('slider-wrapper').style.opacity = "1";
document.getElementById('slider-wrapper').style.pointerEvents = "auto";
document.getElementById('start-btn').innerText = "Start Focus";
document.getElementById('start-btn').className = "btn-start";
refreshUIClock();
updateScoreAndStatsDisplay();
}
function logDistractionIncident() {
statsToday.distractions++;
triggerSystemNotification("⚠️ Accountability Guardrail", "Distraction incident logged. Readjust your focus metrics!");
saveStateToLocalStorage();
updateScoreAndStatsDisplay();
}
function changeMode() {
currentMode = document.getElementById('mode-select').value;
}
// Obligations List Management
function addGoalItem() {
const input = document.getElementById('goal-input');
if (!input.value.trim()) return;
activeGoals.push({ text: input.value, done: false, mode: currentMode });
input.value = '';
saveStateToLocalStorage();
renderGoalsListUI();
}
function completeGoalItem(index) {
activeGoals[index].done = true;
triggerAudioChime();
saveStateToLocalStorage();
renderGoalsListUI();
}
function renderGoalsListUI() {
const list = document.getElementById('goal-list');
list.innerHTML = '';
activeGoals.forEach((goal, i) => {
const li = document.createElement('li');
if (goal.done) li.classList.add('done');
li.innerHTML = <span>[${goal.mode}] ${goal.text}</span> ${!goal.done ?Done: '✅'};
list.appendChild(li);
});
}
// Local Storage Data Engine
function saveStateToLocalStorage() {
localStorage.setItem('yc_focus_logs', JSON.stringify(appLogs));
localStorage.setItem('yc_active_goals', JSON.stringify(activeGoals));
localStorage.setItem('yc_stats_today', JSON.stringify(statsToday));
}
function saveCurrentSessionToLog() {
appLogs.push({
timestamp: Date.now(),
mode: currentMode,
allocatedMins: initialDurationSelected,
overageMins: Math.floor(extraSecondsAccumulated / 60),
distractionsCount: statsToday.distractions
});
saveStateToLocalStorage();
}
function updateScoreAndStatsDisplay() {
document.getElementById('ui-distractions').innerText = statsToday.distractions;
document.getElementById('ui-sessions').innerText = statsToday.completedSessions;
document.getElementById('ui-extra').innerText = ${statsToday.overageMinutes}m;
let score = 100 - (statsToday.distractions * 15);
if (score < 0) score = 0;
document.getElementById('ui-score').innerText = ${score}%;
}
// Advanced Data Purge Script Mechanics
function purgeLogs(range) {
const now = Date.now();
const oneDay = 24 * 60 * 60 * 1000;
if (range === 'all') {
appLogs = [];
activeGoals = [];
statsToday = { distractions: 0, completedSessions: 0, overageMinutes: 0 };
} else if (range === 'day') {
appLogs = appLogs.filter(log => (now - log.timestamp) > oneDay);
} else if (range === 'week') {
appLogs = appLogs.filter(log => (now - log.timestamp) > (oneDay * 7));
} else if (range === 'month') {
appLogs = appLogs.filter(log => (now - log.timestamp) > (oneDay * 30));
}
saveStateToLocalStorage();
updateScoreAndStatsDisplay();
renderGoalsListUI();
alert(Logs clean operation successfully run for range scope: [${range}]);
}
// Plain Parameters Data Export Generator
function exportDataTxt() {
let outputStr = =========================================\n;
outputStr += YC PRODUCTIVITY DATA ENGINE \n;
outputStr += =========================================\n\n;
outputStr += TODAY SUMMARY METRICS:\n;
outputStr += - Sessions Executed: ${statsToday.completedSessions}\n;
outputStr += - Distraction Interceptions: ${statsToday.distractions}\n;
outputStr += - Net Overage Accrued: ${statsToday.overageMinutes} minutes\n\n;
outputStr += HISTORICAL LOG ENTRIES LEDGER:\n;
if (appLogs.length === 0) outputStr += No registered logs found.\n;
appLogs.forEach((log, index) => {
let d = new Date(log.timestamp).toLocaleString();
outputStr += [${d}] Mode: ${log.mode} | Targeted: ${log.allocatedMins}m | Extra time: +${log.overageMins}m | Flags: ${log.distractionsCount} distractions\n;
});
const blob = new Blob([outputStr], { type: 'text/plain' });
const link = document.createElement('a');
link.href = URL.createObjectURL(blob);
link.download = yc-focus-flow-log.txt;
link.click();
}
// Dynamic Visual Stat Sheet Rendering Engine
function generateStatSheetImage() {
const sCanvas = document.getElementById('stat-canvas');
const sCtx = sCanvas.getContext('2d');
sCtx.fillStyle = '#1c1c1f';
sCtx.fillRect(0, 0, sCanvas.width, sCanvas.height);
sCtx.strokeStyle = '#00ffcc';
sCtx.lineWidth = 4;
sCtx.strokeRect(10, 10, sCanvas.width - 20, sCanvas.height - 20);
sCtx.fillStyle = '#00ffcc';
sCtx.font = 'bold 22px Arial';
sCtx.fillText('🏆 PERFORMANCE AUDIT LOG', 40, 50);
sCtx.fillStyle = '#8d8d99';
sCtx.font = '14px Arial';
sCtx.fillText(Generated: ${new Date().toLocaleDateString()}, 40, 75);
sCtx.fillStyle = '#ffffff';
sCtx.font = '16px Arial';
sCtx.fillText(• Focus Sessions Completed: ${statsToday.completedSessions}, 40, 130);
sCtx.fillText(• Distractions Intercepted: ${statsToday.distractions}, 40, 170);
sCtx.fillText(• Extra Overage Accumulated: ${statsToday.overageMinutes} mins, 40, 210);
let finalScore = Math.max(0, 100 - (statsToday.distractions * 15));
sCtx.fillStyle = '#ffcc00';
sCtx.font = 'bold 24px Arial';
sCtx.fillText(FINAL ACCOUNTABILITY SCORE: ${finalScore}%, 40, 290);
const imgLink = document.createElement('a');
imgLink.href = sCanvas.toDataURL('image/png');
imgLink.download = yc-performance-sheet.png;
imgLink.click();
}
// Setup initial running parameters
updateScoreAndStatsDisplay();
renderGoalsListUI();
